name: release

# Fires when a semver tag is pushed. Builds the server binary for the two
# targets a Linux host can actually be, packages each with SHA256 sidecars,
# and attaches everything to a fresh GitHub Release.
#
# Server targets only. There is no macOS or Windows build: this is a service
# you install behind a reverse proxy, and every extra target is a platform to
# support for no one who runs it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release and upload assets

jobs:
  # Pre-flight: a red tag never publishes binaries.
  test:
    name: Gate on tests, clippy and fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The statically-linked musl build is the one bootstrap.sh installs
          # on x86_64: it runs on every distribution regardless of libc.
          - target: x86_64-unknown-linux-musl
            apt_packages: musl-tools
          # aarch64 covers Graviton, Ampere and the ARM tiers of most hosts.
          - target: aarch64-unknown-linux-gnu
            apt_packages: gcc-aarch64-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation packages
        if: matrix.apt_packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Configure cross linker
        if: matrix.cross_linker
        shell: bash
        run: |
          # Cargo reads CARGO_TARGET_<TRIPLE>_LINKER with `-` mapped to `_`
          # and lowercased letters uppercased. Setting it here keeps the
          # override scoped to this job.
          key="CARGO_TARGET_$(echo ${{ matrix.target }} | tr 'a-z-' 'A-Z_')_LINKER"
          echo "$key=${{ matrix.cross_linker }}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF#refs/tags/}"
          stage="axgf-cms-${tag}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/axgf-cms" "$stage/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          cp deploy/bootstrap.sh "$stage/"
          cp -r docs "$stage/docs"

          tar -czf "${stage}.tar.gz" "$stage"

          # bootstrap.sh with no --version fetches from
          # releases/latest/download/, which resolves only an exact asset
          # name — so publish an unversioned copy alongside the tagged one.
          # Without it the advertised one-line install cannot work.
          unversioned="axgf-cms-${{ matrix.target }}.tar.gz"
          cp "${stage}.tar.gz" "$unversioned"

          for f in "${stage}.tar.gz" "$unversioned"; do
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: axgf-cms-${{ matrix.target }}
          if-no-files-found: error
          path: |
            axgf-cms-*.tar.gz
            axgf-cms-*.tar.gz.sha256

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: axgf-cms-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist/* \
            --title "$tag" \
            --generate-notes
