[package]
name = "axgf-cms"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Reference showcase application for the Axiom Genealogy Format (AXGF): browse and edit one .axgf bundle from a single binary."
license = "Apache-2.0"
repository = "https://github.com/plkarin/axgf-cms"
homepage = "https://github.com/plkarin/axgf-spec"
readme = "README.md"
keywords = ["axgf", "genealogy", "gedcom", "family-tree", "cms"]
categories = ["web-programming", "visualization"]

[dependencies]
# All genealogy logic lives here. This crate contains none of its own.
#
# 0.4.0 carries AXGF 1.1 — the person profile this application edits — and is
# not on crates.io yet, so it is pinned to the exact commit it was released
# from. `version` stays beside it so that the day the crate is published the
# `git` and `rev` keys can simply be deleted.
axgf-rs = { version = "0.4", git = "https://github.com/plkarin/axgf-lib", rev = "2815e299c0aaf7a38a0daeee98fb664cf42091de", default-features = false, features = ["gedcom"] }

anyhow = "1"
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.21"
clap = { version = "4", features = ["derive", "env"] }
minijinja = { version = "2", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps object key order stable so the admin raw-JSON editor
# round-trips an entity without silently reordering its fields. axgf-rs enables
# this too; declaring it here makes the dependency explicit rather than
# inherited by feature unification.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower-http = { version = "0.5", features = ["compression-gzip", "fs", "limit", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
kamadak-exif = "0.6"
tokio-util = { version = "0.7", features = ["io"] }
# A streaming import knows each payload's CRC-32 from the ZIP central
# directory before decompressing anything. Recomputing it over a cached file is
# what proves the cache entry is still the bytes that bundle carries, so a warm
# restart can skip the payload entirely instead of re-extracting it.
crc32fast = "1"
argon2 = { version = "0.5.3", features = ["std"] }
hmac = "0.12"
time = { version = "0.3.55", default-features = false, features = ["formatting", "macros", "std"] }
fluent = "0.17.0"
unic-langid = "0.9.6"
intl-memoizer = "0.5.3"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json", "gzip"] }
# A backup archive is an ordinary ZIP so that an operator with nothing but
# `unzip` can get the three files out of it without this binary. Deflate only:
# the bundle inside is already a compressed archive and goes in stored.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# `statvfs`, and the errno constants the rename failures are named by. The one
# reason this crate is not `forbid(unsafe_code)` — see `src/space.rs`.
libc = "0.2"
# Logs as journal *records* rather than as lines of text in a journal. Each
# `tracing` field becomes a journal field, so `journalctl -u axgf-cms
# BYTES=...` works and an operator can filter on what happened rather than
# grepping sentences. Pure Rust: it speaks the journald socket protocol
# directly and links nothing.
tracing-journald = "0.3"

[dev-dependencies]
# The integration tests build real PNGs and decode the thumbnails they get
# back, so they need the same decoder the application uses.
axgf-rs = { version = "0.4", git = "https://github.com/plkarin/axgf-lib", rev = "2815e299c0aaf7a38a0daeee98fb664cf42091de", default-features = false }
base64 = "0.21"
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.4", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
