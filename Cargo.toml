[package]
name = "axgf-cms"
version = "1.0.0"
edition = "2021"
rust-version = "1.92"
description = "Reference showcase application for the Axiom Genealogy Format (AXGF): browse and edit one .axgf bundle from a single binary."
license = "Apache-2.0"
repository = "https://github.com/plkarin/axgf-cms"
homepage = "https://github.com/plkarin/axgf-spec"
readme = "README.md"
keywords = ["axgf", "genealogy", "gedcom", "family-tree", "cms"]
categories = ["web-programming", "visualization"]

[dependencies]
unicode-normalization = "0.1"
# Reading a GEDCOM in whatever encoding a family's software wrote it:
# Windows-1252, Mac Roman and UTF-16 without a byte-order mark (ANSEL, which
# no library has, is decoded in src/gedcom_in.rs). Already in the tree.
encoding_rs = "0.8"
# All genealogy logic lives here. This crate contains none of its own.
#
# 0.6.1 from crates.io: the faithful GEDCOM conversion (the 31 defects of
# tests/gedcom_known_defects.rs, mended), `plan_merge` / `merge_entities` for
# the merge screen, and zip 9. A published version rather than a git pin, so
# that a from-source install resolves exactly what the binary releases were
# built against.
axgf-rs = { version = "0.6.1", default-features = false, features = ["gedcom"] }

anyhow = "1"
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.21"
clap = { version = "4", features = ["derive", "env"] }
minijinja = { version = "2", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps object key order stable so the admin raw-JSON editor
# round-trips an entity without silently reordering its fields. axgf-rs enables
# this too; declaring it here makes the dependency explicit rather than
# inherited by feature unification.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower-http = { version = "0.5", features = ["compression-gzip", "fs", "limit", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
kamadak-exif = "0.6"
tokio-util = { version = "0.7", features = ["io"] }
# A streaming import knows each payload's CRC-32 from the ZIP central
# directory before decompressing anything. Recomputing it over a cached file is
# what proves the cache entry is still the bytes that bundle carries, so a warm
# restart can skip the payload entirely instead of re-extracting it.
crc32fast = "1"
argon2 = { version = "0.5.3", features = ["std"] }
hmac = "0.12"
time = { version = "0.3.55", default-features = false, features = ["formatting", "macros", "std"] }
fluent = "0.17.0"
unic-langid = "0.9.6"
intl-memoizer = "0.5.3"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json", "gzip"] }
# The encrypted export (docs/adr/0011 §4): an OpenPGP message to the
# recipient's public key, readable by `gpg --decrypt`. Pure Rust, so the
# static musl release still links nothing, and streaming, so a 435 MB bundle
# is never in memory. It encrypts only: nothing here ever holds a private key.
pgp = { version = "0.21", default-features = false }
# The bit length of a recipient's RSA key (src/seal.rs). Already in the tree
# through rpgp; named here only for its `PublicKeyParts` trait.
rsa = { version = "0.9", default-features = false }
# The random source rpgp takes, and the one the identity providers' `state`,
# `nonce` and PKCE verifier are drawn from (src/sso.rs).
rand = "0.8"
# A backup archive is an ordinary ZIP so that an operator with nothing but
# `unzip` can get the three files out of it without this binary. Deflate only:
# the bundle inside is already a compressed archive and goes in stored.
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# `statvfs`, and the errno constants the rename failures are named by. The one
# reason this crate is not `forbid(unsafe_code)` — see `src/space.rs`.
libc = "0.2"
# Logs as journal *records* rather than as lines of text in a journal. Each
# `tracing` field becomes a journal field, so `journalctl -u axgf-cms
# BYTES=...` works and an operator can filter on what happened rather than
# grepping sentences. Pure Rust: it speaks the journald socket protocol
# directly and links nothing.
tracing-journald = "0.3"
# Notes and contributions (docs/adr/0014): a note is written in Markdown and
# read as HTML, raw HTML in it shown as text, never run. Pure Rust, the HTML
# writer only.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The same note as a PDF to download, drawn by the server: text in an embedded
# font (static/fonts, DejaVu Sans), the note's pictures, page by page. Pure
# Rust, so the static musl release still links nothing.
krilla = { version = "0.8", default-features = false, features = ["raster-images", "simple-text"] }
# How wide a line of text is in that font, to break a paragraph into lines:
# the shaper krilla draws with (same version), so a line measured is the line
# drawn.
rustybuzz = "0.20"

[dev-dependencies]
# The integration tests build real PNGs and decode the thumbnails they get
# back, so they need the same decoder the application uses.
axgf-rs = { version = "0.6.1", default-features = false }
base64 = "0.21"
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.4", features = ["util"] }
# tests/interactive_walk.rs: parse rendered pages and match the selectors
# the page scripts bind against them.
scraper = "0.20"

# Line tables only: backtraces keep file and line, and the debug tree drops
# the full DWARF that let it grow to 20 GB in a day of test builds.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
