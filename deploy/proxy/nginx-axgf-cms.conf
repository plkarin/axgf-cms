# axgf-cms behind nginx.
#
#   sudo cp deploy/proxy/nginx-axgf-cms.conf /etc/nginx/sites-available/axgf-cms
#   sudo ln -s /etc/nginx/sites-available/axgf-cms /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d tree.example.org        # writes the ssl_* lines
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace tree.example.org throughout. Everything else is tested as it stands:
# this file is run, with only the server name and the certificate paths
# changed, by the test in tests/proxy.rs.
#
# WHY A PROXY AT ALL
#
# axgf-cms speaks plain HTTP and binds 127.0.0.1. That is not a limitation to
# work around by changing the bind address — it is the design. Bound wider than
# localhost without a proxy in front, every password typed into the sign-in
# form crosses the network in clear text, the session cookie is issued without
# `Secure`, and a family's private records are readable by anyone who can reach
# the port. The proxy is what adds TLS; this is where it is added.

# Sign-in attempts, counted per address at the door (README, "Rate limiting
# and jail"). The application jails an address that keeps failing; this keeps
# a flood from reaching it at all. Only posts are counted — a request whose key
# is empty is not limited — so the sign-in page itself is never refused. Both
# are http-level directives: a file in sites-enabled is read inside nginx's
# http block, which is where they belong.
map $request_method $axgf_sign_in {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $axgf_sign_in zone=axgf_sign_in:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tree.example.org;

    # Nothing but the redirect and certbot's challenge. A site that answers on
    # http:// at all will be reached over http:// by somebody's bookmark.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` is the form Ubuntu 24.04 LTS's nginx 1.24 understands.
    # On nginx 1.25.1 and later it is deprecated in favour of a separate
    # `http2 on;` — which 1.24 rejects outright as an unknown directive, so
    # this is the form that works on the LTS this is documented for.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tree.example.org;

    ssl_certificate     /etc/letsencrypt/live/tree.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tree.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:axgf:10m;
    ssl_session_timeout 1d;

    # HSTS is the proxy's to add: the application cannot know it is behind TLS
    # except by being told, and telling browsers to insist on TLS is a promise
    # about the deployment, not about the software. Add it once the certificate
    # is working — a year of HSTS on a name whose certificate has lapsed is a
    # site nobody can reach.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Everything else — Content-Security-Policy, X-Frame-Options,
    # Referrer-Policy, X-Content-Type-Options, Permissions-Policy — is set by
    # the application on every response. Do not add them here as well: nginx
    # `add_header` does not replace the upstream's, so both arrive, and two
    # CSP headers are enforced as the *intersection* of the two. That is how a
    # stylesheet stops loading for no visible reason.

    # A document upload is at most 50 MB. The application reads a larger one
    # to its end, up to 200 MB a request, and refuses it with a page that says
    # so in the reader's language. This limit sits just above those 200 MB so
    # that the refusal comes from the product rather than as a bare nginx 413:
    # the reader gets an explanation instead of a wall.
    client_max_body_size 210m;

    # Every location below hands the request to the application with these,
    # set once here: nginx gives a location the server's proxy_set_header
    # lines only if it sets none of its own, so a location that set one would
    # silently lose the others.
    proxy_http_version 1.1;

    # The four the application actually reads. `X-Forwarded-Proto` is what
    # makes the session cookie `Secure`; `X-Forwarded-For` is what makes the
    # sign-in limits and the jail count per client rather than one bucket for
    # the whole internet, and it is set to $remote_addr rather than appended
    # to, because a client-supplied one would otherwise let an attacker pick
    # their own bucket.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Saving a large bundle rebuilds the whole archive: on a 435 MB archive
    # that is seconds, and on a slow disk it can be a minute. The default 60 s
    # read timeout turns that into a 504 for the reader and leaves the save
    # running — so it is raised well past the worst case.
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Buffer the request body before passing it on, so a slow upload occupies
    # nginx rather than a request handler. Responses are not buffered: the
    # export streams hundreds of megabytes and there is no reason to spool it
    # to disk on the way out.
    proxy_request_buffering on;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # The ways in: ten attempts a minute per address with a burst of ten —
    # far above a person, far below a script — and a 429 past them.
    location = /admin/login {
        limit_req zone=axgf_sign_in burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location ^~ /register {
        limit_req zone=axgf_sign_in burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    # A sign-in through a service starts here with a post (docs/adr/0012),
    # and so does a registration that asks for the site's secret: counted
    # the same way. The services' callbacks come back as GETs, which the map
    # leaves alone.
    location ^~ /auth/ {
        limit_req zone=axgf_sign_in burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    # The import of a whole family (docs/adr/0042): an .axgf archive, its
    # photographs inside, or a GEDCOM, sent to /admin/setup and the addresses
    # under it. The application sets its own limits there — 4 GB for an
    # archive by default, up to 64 GB, in Administration → Uploads — so this
    # location lets a request through up to just above that default. With the
    # 210 MB above, an archive of a few hundred megabytes is refused with a
    # bare 413. Raise this one with the application's, if you raise that.
    #
    # The prefix has no trailing slash, on purpose: for a prefix that ends in
    # one, nginx answers the address without it — /admin/setup, the import
    # page itself — with a 301 to /admin/setup/, which the application does
    # not serve.
    location ^~ /admin/setup {
        client_max_body_size 4200m;

        # An archive takes time to arrive, and once it has, the application
        # reads it whole — and, before it replaces a family, writes and
        # verifies a backup of it.
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        # Streamed to the application rather than spooled by nginx first,
        # which would need its size again on disk — and would write a
        # visitor's gigabytes before the application had looked at who they
        # were. Streamed, a visitor who is not signed in is turned away at the
        # first bytes.
        proxy_request_buffering off;

        proxy_pass http://127.0.0.1:8080;
    }
}
