{# The masthead's language control: a real <select>, showing the language's
   two-letter code so it fits whatever script the interface is in (B5). It
   posts to the same place as the settings tab; ui.js submits on change, and
   the button is there for a reader without scripts, hidden when ui.js runs. #}
{% macro language(t, locales, current_locale, back) %}
<form class="lang-form" method="post" action="/prefs/language">
  <input type="hidden" name="back" value="{{ back }}">
  <select name="lang" aria-label="{{ t('prefs-language') }}" title="{{ current_locale.native_name }}" data-autosubmit>
    {% for l in locales %}
    <option value="{{ l.tag }}" lang="{{ l.tag }}" {{ "selected" if l.tag == current_locale.tag }}>{{ l.code }}</option>
    {% endfor %}
  </select>
  <button class="btn small" type="submit" data-autosubmit-go>{{ t("prefs-apply") }}</button>
</form>
{% endmacro %}
